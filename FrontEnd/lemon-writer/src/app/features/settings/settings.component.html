<app-navbar></app-navbar>

<div class="settings-page">
  <h1 class="page-title">Settings</h1>

  <div class="settings-grid">
    <section class="settings-section">
      <h2>Appearance</h2>
      <p class="section-desc">Choose a theme that sets the right mood for your writing.</p>
      <app-theme-picker></app-theme-picker>
    </section>

    <mat-divider></mat-divider>

    <section class="settings-section">
      <h2>Profile</h2>
      <p class="section-desc">Update your display name and email address.</p>

      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="profile-form">
        <mat-form-field appearance="outline">
          <mat-label>Display Name</mat-label>
          <input matInput formControlName="displayName">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="profileForm.invalid">
          Save Profile
        </button>
      </form>
    </section>
  </div>
</div>
