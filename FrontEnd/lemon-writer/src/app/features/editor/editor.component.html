<app-navbar></app-navbar>

@if (!loading()) {
  <div class="editor-container">
    <app-editor-toolbar
      [wordCount]="wordCount()"
      [autoSaveStatus]="autoSaveStatus()"
      (takeSnapshot)="onTakeSnapshot()"
      (seeTimeline)="goToTimeline()"
      (seeDrafts)="goToDrafts()"
    ></app-editor-toolbar>

    <div class="chapter-title-bar">
      <h2 class="chapter-title">{{ chapter()?.title }}</h2>
    </div>

    <div class="editor-wrapper">
      <mat-form-field appearance="outline" class="editor-field">
        <textarea
          matInput
          cdkTextareaAutosize
          cdkAutosizeMinRows="20"
          [ngModel]="content()"
          (ngModelChange)="onContentInput($event)"
          placeholder="Begin your story here..."
          class="editor-textarea"
          spellcheck="true"
        ></textarea>
      </mat-form-field>
    </div>
  </div>
} @else {
  <div class="loading-overlay">
    <div class="loading-indicator">Loading your chapter...</div>
  </div>
}
