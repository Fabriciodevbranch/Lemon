syntax = "proto3";
option csharp_namespace = "LemonWriter.Grpc";
package chapters;

service ChaptersService {
  rpc GetChapters (GetChaptersRequest) returns (GetChaptersResponse);
  rpc GetChapter (GetChapterRequest) returns (ChapterResponse);
  rpc CreateChapter (CreateChapterRequest) returns (ChapterResponse);
  rpc UpdateChapter (UpdateChapterRequest) returns (ChapterResponse);
  rpc GetTimeline (GetTimelineRequest) returns (GetTimelineResponse);
  rpc CreateSnapshot (CreateSnapshotRequest) returns (SnapshotResponse);
  rpc RestoreToSnapshot (RestoreToSnapshotRequest) returns (ChapterResponse);
}

message GetChaptersRequest { string book_id = 1; }
message GetChaptersResponse { repeated ChapterResponse chapters = 1; }
message GetChapterRequest { string id = 1; }
message ChapterResponse {
  string id = 1; string book_id = 2; string title = 3;
  int32 order = 4; string current_content = 5;
  string created_at = 6; string updated_at = 7;
}
message CreateChapterRequest { string book_id = 1; string title = 2; int32 order = 3; }
message UpdateChapterRequest { string id = 1; string title = 2; string content = 3; int32 order = 4; }
message GetTimelineRequest { string chapter_id = 1; }
message GetTimelineResponse { repeated SnapshotResponse snapshots = 1; }
message CreateSnapshotRequest { string chapter_id = 1; string content = 2; string message = 3; string author_id = 4; }
message SnapshotResponse {
  string id = 1; string chapter_id = 2; string content = 3;
  string message = 4; string created_at = 5; string author_id = 6;
  string parent_snapshot_id = 7;
}
message RestoreToSnapshotRequest { string chapter_id = 1; string snapshot_id = 2; }
