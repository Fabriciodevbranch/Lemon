global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: lemon-api
    metrics_path: /metrics
    static_configs:
      - targets: [backend:8080]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
