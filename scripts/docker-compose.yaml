services:
  postgres:
    image: postgres:16
    container_name: lemon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lemon
      POSTGRES_PASSWORD: lemon
      POSTGRES_DB: lemondb
    ports:
      - "5432:5432"
    volumes:
      - lemon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemon -d lemondb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lemon_net

  backend:
    build:
      context: ../BackEnd
      dockerfile: Dockerfile
    container_name: lemon-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=lemondb;Username=lemon;Password=lemon
      Jwt__Key: ${JWT_KEY:-local-development-secret-key-change-before-production}
      Jwt__Issuer: LemonWriter
      Jwt__Audience: LemonWriterClient
      Jwt__ExpiryMinutes: 480
      Security__AllowDevelopmentSecrets: "true"
      Grpc__Enabled: "false"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-placeholder-client-id}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-placeholder-client-secret}
      Frontend__BaseUrl: http://localhost:4200
      Cors__AllowedOrigins__0: http://localhost:4200
      OpenTelemetry__Endpoint: http://otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lemon_net
    develop:
      watch:
        - action: rebuild
          path: ../BackEnd

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: lemon-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - lemon_net
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    container_name: lemon-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - lemon_net

  loki:
    image: grafana/loki:3.5.1
    container_name: lemon-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - lemon_loki:/loki
    ports:
      - "3100:3100"
    networks:
      - lemon_net

  cadvisor:
    image: ghcr.io/google/cadvisor:0.57.0
    container_name: lemon-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=true
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /dev/disk:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      - "8081:8080"
    networks:
      - lemon_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: lemon-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://lemon:lemon@postgres:5432/lemondb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lemon_net

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: lemon-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - lemon_prometheus:/prometheus
    ports:
      - "9090:9090"
    networks:
      - lemon_net
    depends_on:
      - cadvisor
      - postgres-exporter

  grafana:
    image: grafana/grafana:12.0.2
    container_name: lemon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-lemon-grafana-readonly}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - lemon_grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
      loki:
        condition: service_started
      postgres:
        condition: service_healthy
      admin-seed:
        condition: service_completed_successfully
    networks:
      - lemon_net

  frontend:
    build:
      context: ../FrontEnd/lemon-writer
      dockerfile: Dockerfile
    container_name: lemon-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - lemon_net
    develop:
      watch:
        - action: rebuild
          path: ../FrontEnd/lemon-writer
          ignore:
            - node_modules/
            - dist/

  admin-seed:
    image: postgres:16
    container_name: lemon-admin-seed
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: lemondb
      PGUSER: lemon
      PGPASSWORD: lemon
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-lemon-grafana-readonly}
    volumes:
      - ./postgres/001-seed-admin.sql:/seed/001-seed-admin.sql:ro
      - ./postgres/002-grafana-reader.sql:/seed/002-grafana-reader.sql:ro
      - ./postgres/seed-admin.sh:/seed/seed-admin.sh:ro
    command: ["sh", "/seed/seed-admin.sh"]
    depends_on:
      backend:
        condition: service_started
    networks:
      - lemon_net

volumes:
  lemon_pgdata:
  lemon_prometheus:
  lemon_grafana:
  lemon_loki:

networks:
  lemon_net:
    driver: bridge
